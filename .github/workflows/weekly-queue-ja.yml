name: weekly-queue-ja

on:
  schedule:
    # 11:00 UTC 토요일 = 20:00 KST 토요일 (일본어 계정: 화·금 2건)
    - cron: "0 11 * * 6"
  workflow_dispatch:
    inputs:
      mode:
        description: "week=다음 화·금 2건 생성 / regenerate=해당 날짜 새 주제로 재생성 / rerender=수정한 post.json으로 카드만 다시 그림"
        type: choice
        options: [week, regenerate, rerender]
        default: week
      date:
        description: "regenerate·rerender 대상 날짜 (예: 2026-09-28)"
        required: false

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      MODE: ${{ inputs.mode || 'week' }}
      LOCALE: ja
      DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: 원고 생성 · AI 검증 · 카드 렌더
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "$MODE" != "week" ] && [ -z "$DATE" ]; then
            echo "::error::$MODE 모드는 date 칸에 날짜(YYYY-MM-DD)를 넣어야 합니다. mode 를 바꾸면 date 칸이 비워지니 mode 를 먼저 고르고 날짜를 입력하세요."
            exit 1
          fi
          case "$MODE" in
            rerender)   node src/render.mjs --date "$DATE" ;;
            regenerate) node src/queue-build.mjs --date "$DATE" --force ;;
            *)          node src/queue-build.mjs ;;
          esac

      - name: 큐 커밋
        run: |
          git config user.name  "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add queue-ja config/used.ja.json || true
          git commit -m "queue: $MODE ${DATE}" || echo "변경 없음"
          # 다른 워크플로가 같은 브랜치에 먼저 푸시했을 수 있다
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${BRANCH:-main}" && git push && { ok=1; break; }
            echo "푸시 충돌, 재시도 $i"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::푸시에 3회 실패했습니다"; exit 1; }

      - name: 이미지 반영 대기
        run: sleep 20

      - name: 검수 이슈 생성/갱신
        run: |
          if [ "$MODE" = "week" ]; then node src/issue.mjs week
          else node src/issue.mjs single; fi
