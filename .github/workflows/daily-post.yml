name: daily-publish

on:
  schedule:
    # 22:00 UTC (일~목) = 07:00 KST (월~금)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      date:
        description: "발행할 날짜 (비우면 오늘)"
        required: false
      dry_run:
        description: "발행 직전까지만 실행"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 승인 여부 확인
        id: gate
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: node src/gate.mjs

      - name: 인스타그램 발행
        if: steps.gate.outputs.approved == 'true'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POST_DIR: queue/${{ steps.gate.outputs.date }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/queue/${{ steps.gate.outputs.date }}
        run: node src/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 발행 기록
        if: steps.gate.outputs.approved == 'true' && !inputs.dry_run
        run: |
          git config user.name  "ig-bot"
          git config user.email "ig-bot@users.noreply.github.com"
          git add config/published.log
          git commit -m "published: ${{ steps.gate.outputs.date }}"
          # 다른 워크플로가 같은 브랜치에 먼저 푸시했을 수 있다
          ok=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${BRANCH:-main}" && git push && { ok=1; break; }
            echo "푸시 충돌, 재시도 $i"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "::error::푸시에 3회 실패했습니다"; exit 1; }
          ID=$(node -p "require('./build/published.json').id")
          gh issue comment ${{ steps.gate.outputs.issue }} --repo "$REPO" \
            --body "${{ steps.gate.outputs.date }} 발행 완료 (media_id: $ID)"
