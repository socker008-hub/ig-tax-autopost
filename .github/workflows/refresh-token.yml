name: refresh-ig-token

on:
  schedule:
    - cron: "37 1 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 토큰 갱신 후 시크릿 덮어쓰기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          NEW=$(node src/refresh-token.mjs)
          echo -n "$NEW" | gh secret set IG_ACCESS_TOKEN --repo ${{ github.repository }}
          echo "토큰 갱신 완료"
